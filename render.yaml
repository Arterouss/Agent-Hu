services:
  - type: web
    name: claude-hunter-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python hunter.py --serve --interval 2
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CHECK_INTERVAL_MINUTES
        value: "2"
