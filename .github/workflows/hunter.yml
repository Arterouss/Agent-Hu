name: Claude Pro Invite Link Hunter

on:
  schedule:
    # Runs every 20 minutes (cron format: minute hour day month day-of-week)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  hunt:
    name: Scan & Notify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hunter Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL_MINUTES: 20
        run: |
          python hunter.py

      - name: Commit and push updated seen_links.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.txt
          if git diff --staged --quiet; then
            echo "No new links discovered. Skipping commit."
          else
            git commit -m "chore: update seen_links.txt [skip ci]"
            git push
          fi
